name: Promote or roll back production image

on:
  workflow_dispatch:
    inputs:
      action:
        description: Release action
        required: true
        type: choice
        options: [promote, rollback]
      image:
        description: GHCR image tag or sha256 digest
        required: true
        type: string

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}

jobs:
  production-release:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve immutable digest
        id: image
        shell: bash
        env:
          RELEASE_IMAGE: ${{ inputs.image }}
        run: |
          image_name="$(printf '%s' "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')"
          if [[ "$RELEASE_IMAGE" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            digest="$RELEASE_IMAGE"
          elif [[ "$RELEASE_IMAGE" =~ ^[0-9]{8}-[0-9]{6}-[a-f0-9]{7}$ ]]; then
            digest="$(docker buildx imagetools inspect "$image_name:$RELEASE_IMAGE" --format '{{.Manifest.Digest}}')"
          else
            echo 'image must be a release tag or sha256 digest' >&2
            exit 1
          fi
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo 'could not resolve an immutable digest' >&2; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "image=$image_name@$digest" >> "$GITHUB_OUTPUT"
      - name: Verify requested digest is running in development
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.DEV_RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE: ${{ vars.DEV_RAILWAY_SERVICE }}
          RAILWAY_ENVIRONMENT: ${{ vars.DEV_RAILWAY_ENVIRONMENT }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          for required_name in RAILWAY_API_TOKEN RAILWAY_PROJECT_ID RAILWAY_SERVICE RAILWAY_ENVIRONMENT; do
            if [ -z "${!required_name}" ]; then
              echo "Required development deployment configuration is missing: $required_name" >&2
              exit 1
            fi
          done
          status="$(npx --yes @railway/cli status --json --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT")"
          echo "$status" | jq -e --arg service "$RAILWAY_SERVICE" --arg digest "$DIGEST" \
            '[.. | objects | select(.serviceName? == $service) | .latestDeployment.meta.imageDigest] | any(.[]; . == $digest)' >/dev/null || {
            echo "Development is not running requested digest $DIGEST" >&2
            exit 1
          }
      - name: Deploy exact digest to production
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
          RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT }}
          IMAGE: ${{ steps.image.outputs.image }}
        run: npx --yes @railway/cli service source connect --image "$IMAGE" --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_SERVICE" --environment "$RAILWAY_ENVIRONMENT"
      - name: Record production release
        env:
          RELEASE_ACTION: ${{ inputs.action }}
          RELEASE_REF: ${{ inputs.image }}
          IMAGE: ${{ steps.image.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: echo "action=$RELEASE_ACTION release_ref=$RELEASE_REF image=$IMAGE digest=$DIGEST workflow_commit=$GITHUB_SHA deployed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee production-release.txt
      - uses: actions/upload-artifact@v4
        with:
          name: production-${{ inputs.action }}-${{ github.run_id }}
          path: production-release.txt
      - name: Verify deployed health endpoint
        env:
          RAILWAY_PUBLIC_URL: ${{ vars.RAILWAY_PUBLIC_URL }}
        run: curl --fail --show-error --retry 12 --retry-delay 5 "$RAILWAY_PUBLIC_URL/health"
      - name: Install production verification dependencies
        run: npm ci
      - name: Verify production HTTP behavior
        env:
          APP_URL: ${{ vars.RAILWAY_PUBLIC_URL }}
        run: npm run test:integration
      - name: Install Chromium for production verification
        run: npx playwright install --with-deps chromium
      - name: Verify production collaboration
        env:
          APP_URL: ${{ vars.RAILWAY_PUBLIC_URL }}
        run: npm run test:e2e
